[workspace]
members = ["crates/rift-core", "crates/rift-cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/skylineagle/rift"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tokio-util = "0.7"
toml = "0.8"
rift-core = { package = "rift-bridge-core", path = "crates/rift-core", version = "0.2.0" }
