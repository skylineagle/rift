[package]
name = "rift-bridge-core"
description = "Bridge engine for Rift: pipe bytes between UART, TCP and UDP endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "rift_core"

[dependencies]
bytes.workspace = true
chrono.workspace = true
dirs.workspace = true
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-serial.workspace = true
tokio-util.workspace = true
toml.workspace = true
tempfile.workspace = true
ureq.workspace = true
amqprs = { version = "2", features = ["tls", "urispec"] }
async-trait = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
