[package]
name = "rift-cli"
description = "Rift CLI: bridge UART, TCP and UDP endpoints from the terminal or a container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
flate2 = "1.1.11"
rift-core.workspace = true
self-replace = "1.5.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
tar = "0.4.46"
tempfile.workspace = true
tokio.workspace = true
ureq.workspace = true
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
